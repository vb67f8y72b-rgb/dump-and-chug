<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dump and Chug</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;800;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: dek-rink scoreboard hero, then calendrier → stats → alignement in one column; ball-orange is the single accent */
/* Layout: green-and-gold crest hero (logo + scoreboard), then calendrier → stats → alignement in one column */
:root{
  --bg:#f3f4ec;        /* pale cream, green-biased */
  --surface:#ffffff;
  --ink:#122a1c;
  --muted:#58685d;
  --line:#d8ddd0;
  --rink:#0f4a2a;      /* team green */
  --rink-ink:#fbf7ea;  /* crest cream */
  --ball:#f4c430;      /* team gold, for fills */
  --accent-ink:#0f6a3a;/* readable accent text on light */
  --win:#1f8a55;
  --loss:#c0392b;
  --display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1510;--surface:#14211a;--ink:#eef0e6;--muted:#9aab9f;--line:#24362b;
  --rink:#0d3d23;--rink-ink:#fbf7ea;--ball:#f4c430;--accent-ink:#f4c430;--win:#3cc483;--loss:#ff6b5b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1510;--surface:#14211a;--ink:#eef0e6;--muted:#9aab9f;--line:#24362b;
  --rink:#0d3d23;--rink-ink:#fbf7ea;--ball:#f4c430;--accent-ink:#f4c430;--win:#3cc483;--loss:#ff6b5b;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px;padding-block:20px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1,h2{font-family:var(--display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Hero: the rink */
.rink{position:relative;overflow:hidden;background:var(--rink);color:var(--rink-ink);border-radius:28px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:22px}
.rink::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.18);border-radius:18px;pointer-events:none}
.rink::after{content:"";position:absolute;left:50%;top:-40px;bottom:-40px;width:0;border-left:3px solid rgba(244,196,48,.45);pointer-events:none}
.rink .faceoff{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border:2px solid rgba(255,255,255,.14);border-radius:50%;pointer-events:none}
.rink > *{position:relative;z-index:1}
.rink .eyebrow{color:rgba(234,241,248,.75)}
.rink h1{font-size:clamp(3.2rem,13vw,6.4rem);font-weight:900;letter-spacing:.01em}
.rink h1 span{color:var(--ball)}
.crest{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.crest img{width:clamp(120px,32vw,190px);height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.crest .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 220px}
.rink{border:4px solid var(--ball)}
.board{display:flex;flex-wrap:wrap;gap:12px}
.cell{background:rgba(0,0,0,.28);border-radius:12px;padding:10px 14px;min-width:84px;display:flex;flex-direction:column}
.cell b{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1}
.cell small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;opacity:.75}
.next{background:var(--ball);color:#0f2a1a;border-radius:14px;overflow:hidden;padding-block:12px;position:relative}
.ticker{display:flex;width:max-content;animation:defile 18s linear infinite}
.next:hover .ticker{animation-play-state:paused}
.ticker .item{display:flex;align-items:center;gap:14px;padding-right:14px;white-space:nowrap}
.ticker .tag{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;background:#0f2a1a;color:var(--ball);border-radius:999px;padding:2px 10px}
.ticker strong{font-family:var(--display);font-weight:800;font-size:1.55rem;text-transform:uppercase;line-height:1}
.ticker .where{font-size:.95rem;font-weight:500}
.ticker .dot{width:8px;height:8px;border-radius:50%;background:#0f2a1a;flex:none}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker{animation:none}.ticker .copy+.copy{display:none}.next{padding-inline:16px}}

section{display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--rink);box-shadow:0 3px 0 var(--ball);padding-bottom:6px}
.head h2{font-size:2.4rem;font-weight:800}

/* Schedule */
.games{display:flex;flex-direction:column;gap:8px}
.game{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.date{font-family:var(--cond);text-transform:uppercase;line-height:1.1}
.date b{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem}
.date span{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.opp{min-width:0}
.opp b{font-weight:600}
.opp div{font-size:.86rem;color:var(--muted)}
.res{font-family:var(--display);font-weight:800;font-size:1.4rem;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-family:var(--cond);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.pill.L{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.pill.W{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.pill.up{background:color-mix(in srgb,var(--ball) 30%,transparent);color:var(--accent-ink)}
.game.is-next{border-color:var(--ball);box-shadow:0 0 0 2px color-mix(in srgb,var(--ball) 35%,transparent)}

/* Stats */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
thead th button:focus-visible{outline:2px solid var(--ball);outline-offset:3px;border-radius:3px}
thead th[aria-sort] button{color:var(--ink)}
thead th[aria-sort="descending"] button::after{content:"▼";font-size:.6rem;color:var(--accent-ink)}
thead th[aria-sort="ascending"] button::after{content:"▲";font-size:.6rem;color:var(--accent-ink)}
tbody tr+tr td{border-top:1px solid var(--line)}
td.p{font-weight:600}
.cote{font-family:var(--cond);font-weight:600;font-size:.78rem;color:var(--muted);margin-right:6px}
.goalie{display:flex;flex-wrap:wrap;gap:10px}
.goalie .g{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:96px}
.goalie .g b{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05}
.goalie .g small{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted);margin:0}

/* Roster */
document.getElementById("count").textContent=`${players.length+1} joueurs`;
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.player .jn{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:1;color:var(--accent-ink)}
.player .nm{font-weight:600;line-height:1.25}
.player .meta{font-size:.82rem;color:var(--muted)}
.player.gk{background:var(--rink);border-color:var(--rink);color:var(--rink-ink)}
.player.gk .jn{color:var(--ball)}
.player.gk .meta{color:rgba(251,247,234,.75)}

.plink{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.plink:hover{text-decoration-color:var(--ball)}
.plink:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:2px}
footer{font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--ink)}

@media (max-width:480px){
  .game{grid-template-columns:60px 1fr auto;gap:10px;padding:10px 12px}
  .date b{font-size:1.35rem}
  .head h2{font-size:2rem}
}
</style>

</head>

    <td>${fmtMin(p.pun)}</td><td>${p.pp.toFixed(2).replace(".",",")}</td></tr>`).join("");
  document.querySelectorAll("#stats-table th").forEach(th=>{
    if(th.dataset.k===sortK) th.setAttribute("aria-sort",dir<0?"descending":"ascending"); else th.removeAttribute("aria-sort");
  });
}
document.querySelectorAll("#stats-table th button").forEach(b=>b.addEventListener("click",()=>{
  const k=b.parentElement.dataset.k;
  if(k===sortK) dir=-dir; else {sortK=k;dir=k==="name"?1:-1}
  render();
}));
render();

/* Roster */
document.getElementById("count").textContent=`${players.length+1} joueurs`;
const roster=[...players].sort((x,y)=>x.no-y.no || x.name.localeCompare(y.name,"fr"));
document.getElementById("roster").innerHTML=roster.map(p=>`<div class="player">
  <span class="jn num">${p.no}</span><span class="nm">${prof(p)}${p.alt?" (A)":""}</span>
  <span class="meta">Cote ${p.cote} · ${p.from}</span></div>`).join("")+
  `<div class="player gk"><span class="jn num">${goalie.no}</span><span class="nm">${prof(goalie)}</span>
  <span class="meta">Gardien · Cote ${goalie.cote} · ${goalie.from}</span></div>`;
</script>

</body>
</html>
